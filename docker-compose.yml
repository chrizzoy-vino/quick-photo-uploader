services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      # Admin-Bereich (/admin) bleibt ohne gesetztes Secret gesperrt.
      ADMIN_SECRET: ${ADMIN_SECRET:?Bitte ADMIN_SECRET setzen, z.B. via `openssl rand -hex 32`}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
