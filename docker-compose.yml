services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      # The admin area (/admin) stays locked without a value set.
      ADMIN_SECRET: ${ADMIN_SECRET:?Please set ADMIN_SECRET, e.g. via `openssl rand -hex 32`}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
