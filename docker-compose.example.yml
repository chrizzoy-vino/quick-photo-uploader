# Example compose file for homelab deployment.
#
# Unlike docker-compose.yml (builds locally from the repo), this file pulls
# the prebuilt image that the CD pipeline (.github/workflows/cd.yml) builds
# and pushes to ghcr.io. `latest` always points at the most recent tagged
# release (see ADR-0012) - not at whatever is currently on `main`. For the
# latest unreleased `main` snapshot, use the `edge` tag instead.
#
# Usage:
#   1. Copy this file to docker-compose.yml (or edit it in place).
#   2. Run `docker compose up -d` in the target directory.
#
# If the GHCR package is private, the host needs to log in once beforehand:
#   docker login ghcr.io -u <github-username> -p <personal-access-token with read:packages>
# Alternatively, set the package to "Public" under
# github.com/<user>/<repo>/pkgs/container/quick-photo-uploader - then no login is needed.

services:
  quick-photo-uploader:
    image: ghcr.io/chrizzoy-vino/quick-photo-uploader:latest
    container_name: quick-photo-uploader
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Access secret for the admin area (/admin) - a long, random value, e.g. generated via
      # `openssl rand -hex 32`, set here (or in a .env file next to this one).
      # Without a value set, the admin area stays locked.
      ADMIN_SECRET: "changeme"
    volumes:
      # Holds the SQLite database, the album files (originals, thumbnails, converted display
      # variants), and optionally ./data/content/{impressum,datenschutz}.md - operator-provided
      # legal pages, read at runtime (see ADR-0010). Without those files, /impressum and
      # /datenschutz show a placeholder instead of real content.
      - ./data:/data
    # Optional: pin to a specific release instead of always tracking the
    # newest one:
    # image: ghcr.io/chrizzoy-vino/quick-photo-uploader:0.1.0
    #
    # Optional: if a reverse proxy (Traefik, nginx, Caddy, ...) runs in the
    # homelab, add matching labels/networks here and remove ports.
